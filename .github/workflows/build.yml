name: Build

# ═══════════════════════════════════════════════════════════════════════════
# Untitled Trust Builder — Multi-Platform Build Pipeline
#
# Produces installable artifacts for all five target platforms from the single
# client-side React/Vite app:
#
#   Desktop (Tauri 2)
#     • Windows  → .msi / .exe (NSIS)
#     • Linux    → .deb / .AppImage / .rpm
#     • macOS    → .dmg / .app        (opt-in, see "Apple targets" below)
#
#   Mobile (Capacitor)
#     • Android  → .apk (debug, direct install) + .aab (Play upload, if signed)
#     • iOS      → unsigned .xcarchive (opt-in, see "Apple targets" below)
#
# Apple targets (macOS desktop + iOS) are OFF by default: there is no Apple
# Developer account yet, so the output could not be distributed, and macOS
# runners bill at 10x. Tag pushes never build them. To build them anyway, run
# this workflow manually (Actions → Build → Run workflow) and tick
# "include_apple".
#
#   Web
#     • static bundle (dist/public) uploaded as an artifact for any host
#
# Triggers
#   • Version tag push  (v1.2.3, v2.0.0-rc.1, …) — builds + creates a Release
#   • workflow_dispatch — manual run, builds only (no Release)
#
# Optional signing secrets (builds succeed unsigned if absent):
#   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
#   APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID
#
# To cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for artifact names (e.g. v0.1.0)"
        required: false
        default: "manual"
      include_apple:
        description: "Also build macOS desktop + iOS archive (needs no secrets, but output is unsigned)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ── Web bundle ─────────────────────────────────────────────────────────────
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/public
          if-no-files-found: error

  # ── Desktop (Tauri) — Windows / macOS / Linux ───────────────────────────────
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # Linux + Windows always; macOS only on a manual run with include_apple.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_apple && '[{"os":"ubuntu-22.04","label":"Linux"},{"os":"windows-latest","label":"Windows"},{"os":"macos-latest","label":"macOS"}]' || '[{"os":"ubuntu-22.04","label":"Linux"},{"os":"windows-latest","label":"Windows"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Release upload only happens on tag pushes (tauri-action handles this
          # automatically when tagName is provided).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Untitled Trust Builder {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref, '-') }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn

  # ── Android (Capacitor) ─────────────────────────────────────────────────────
  android:
    name: Android (APK/AAB)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Add Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB (signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # ── iOS (Capacitor) — unsigned archive ──────────────────────────────────────
  ios:
    name: iOS (archive)
    # Opt-in only (see "Apple targets" in the header).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_apple }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Add iOS platform
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/App/build/App.xcarchive
          if-no-files-found: warn
